events {}

http {
    client_max_body_size 6M;

    # Load balancer : "api" pointe vers TOUS les conteneurs API (scaling horizontal).
    # Nginx répartit les requêtes à tour de rôle (round robin).
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 80;

        # API :  http://<ip>/api/predict  ->  api:8000/predict
        location /api/ {
            proxy_pass http://api_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Interface web Streamlit (a besoin des websockets)
        location / {
            proxy_pass http://ui:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }
}
