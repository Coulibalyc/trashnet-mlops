events {}

http {
    client_max_body_size 6M;

    # DNS interne de Docker, relu toutes les 10 s : si une API redémarre
    # ou si on passe de 3 à 5 API, Nginx s'en rend compte tout seul.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        # HTTPS (certificat auto-signé) : passe à travers les Wi-Fi qui bloquent le port 80
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # API :  http://<ip>/api/predict  ->  api:8000/predict
        # "api" pointe vers TOUS les conteneurs API : Nginx répartit les requêtes (load balancing).
        location /api/ {
            set $api http://api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout;
        }

        # Interface web Streamlit (a besoin des websockets)
        location / {
            set $ui http://ui:8501;
            proxy_pass $ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }
}
